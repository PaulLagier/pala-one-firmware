<!doctype html><body><input id="ssEditFile" type="file"><input id="ssTolerance"><input id="ssToleranceLabel"><input id="ssZoom"><input id="ssZoomLabel"><input id="ssPanX"><input id="ssPanY"><input id="ssPanXLabel"><input id="ssPanYLabel"><input id="ssInvert"><input id="ssMeta"><input id="ssUploadStatus"><input id="ssResetBtn"><input id="ssUploadBtn"><input id="ssDestination"><input id="ssRotateBtn"><canvas id="ssPreview" width="250" height="122"></canvas><pre id="result">RUNNING</pre><script>window.palaEditorLabels=Array.from({length:12},(_,i)=>"label"+i);window.palaFmt=(s,...args)=>s;const posted=[];window.fetch=(url,opts)=>{posted.push(opts.body);return Promise.resolve({ok:true})};const realTimeout=setTimeout;window.setTimeout=(fn,ms)=>ms===600?0:realTimeout(fn,ms);</script><script>__PALA_EDITOR_SOURCE__</script><script>
(async()=>{const get=id=>document.getElementById(id),wait=()=>new Promise(r=>realTimeout(r,20));function check(ok,msg){if(!ok)throw Error(msg)}
const bytes=new Uint8Array(3904);for(let y=0;y<122;y++)for(let x=80;x<250;x++)bytes[y*32+(x>>3)]|=1<<(x&7);
async function load(data,name){const dt=new DataTransfer();dt.items.add(new File([data],name));get('ssEditFile').files=dt.files;get('ssEditFile').dispatchEvent(new Event('change'));for(let attempt=0;attempt<100;attempt++){await wait();if(get('ssMeta').textContent!=='label1'||get('ssUploadStatus').textContent) return;}throw Error('file load timeout')}
async function upload(){get('ssDestination').value='single';get('ssUploadBtn').click();await wait();return new Uint8Array(await posted.at(-1).get('file').arrayBuffer())}
get('ssTolerance').value='0';get('ssZoom').value='100';get('ssPanX').value=get('ssPanY').value='0';get('ssInvert').checked=false;
await load(bytes,'saved.BIN');let out=await upload();check(out.length===3904&&out.every((b,i)=>b===bytes[i]),'raw bitmap round trip');
const ctx=get('ssPreview').getContext('2d');const pixel=(x,y)=>ctx.getImageData(x,y,1,1).data[0];
get('ssRotateBtn').click();check(pixel(125,20)===0&&pixel(125,100)===255&&pixel(10,61)===255,'clockwise 90 fit');
get('ssRotateBtn').click();check(pixel(230,61)===0&&pixel(20,61)===255,'180 orientation');
get('ssRotateBtn').click();check(pixel(125,100)===0&&pixel(125,20)===255,'270 orientation');
get('ssRotateBtn').click();out=await upload();check(out.every((b,i)=>b===bytes[i]),'four rotations preserve source pixels');
const png=Uint8Array.from(atob(get('ssPreview').toDataURL('image/png').split(',')[1]),c=>c.charCodeAt(0));
await load(png,'source.png');out=await upload();check(out.every((b,i)=>b===bytes[i]),'standard PNG import preserved');
for(const size of [0,3903,3905]){await load(new Uint8Array(size),'bad.bin');const n=posted.length;window.alert=()=>{};get('ssUploadBtn').click();check(posted.length===n,'reject invalid size '+size)}
get('result').textContent=JSON.stringify({success:true,checks:['exact raw import/export','standard PNG import','90/180/270 orientation and fit','four rotations lossless','invalid lengths rejected']});
})().catch(e=>document.getElementById('result').textContent='FAIL '+e.message);
</script>
