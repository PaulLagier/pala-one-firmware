; PlatformIO Project Configuration
;
; The repo is dual-build: the same sources compile under both Arduino IDE 2
; and PlatformIO. See README.md for the trade-off and per-build setup.
;
; Layout:
;   Pala_One_2_1/Pala_One_2_1.ino    — Arduino-IDE entry, also compiled by PIO
;   Pala_One_2_1/pala_api.h          — public app API headers (used by examples/)
;   Pala_One_2_1/pala_app.h
;   Pala_One_2_1/src/                — firmware modules (hal/, pure/, storage/, ui/, web/)
;   Pala_One_2_1/partitions.csv      — partition table
;
; src_dir is set to the sketch folder so PIO picks up both the .ino and
; everything under src/. Firmware sources use full-from-sketch-root includes
; like `#include "src/hal/display.h"` — same path resolves under Arduino IDE
; (sketch folder root is on its include path; `src/` is not, hence the prefix).
; See README.md "Include style" for the why.

[platformio]
src_dir = Pala_One_2_1

[env]
; pioarduino fork — ships arduino-esp32 3.x (IDF 5.x), matching the Arduino IDE
; default. The classic `platformio/espressif32` registry build is still on
; 2.0.17 (IDF 4.4), which keeps Heltec's deep-sleep path on a code branch that
; powers off RTC_PERIPH and breaks ext0 wake. See src/ui/sleep.cpp for context.
; Pinned to release 55.03.38-1 (arduino-esp32 3.3.8 / IDF 5.5.4) so builds are
; reproducible; bump deliberately. The previous `stable` URL is a moving alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = Pala_One_2_1/partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/build_info.py

; test/ holds host-side CMake unit tests, not PlatformIO on-device tests.
; Tell `pio test` to ignore everything in there so it doesn't try to compile
; laptop-only tests onto the ESP32.
test_ignore = *

lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
  adafruit/Adafruit GFX Library @ 1.12.6
  olikraus/U8g2_for_Adafruit_GFX @ 1.8.0

; Base envs — set the board / display flags. They're not the recommended
; build targets directly; pick a language-qualified leaf env below instead.
; (Building one of these without a LANG_* falls back to LANG_EN with a
; #pragma message from src/config.h, so they still compile.)
[env:wireless-paper-v1_2]
build_flags =
  -D WIRELESS_PAPER
  -D DISPLAY_V1_2

[env:wireless-paper-v1_1]
build_flags =
  -D WIRELESS_PAPER
  -D DISPLAY_V1_1

; Per-language leaf envs — pick one of these to flash. The same source
; tree builds 4 firmware images: (V1.1 | V1.2) x (English | Spanish-LA).
; Adding a third language: clone en.h / es_la.h to <lang>.h, mirror the
; key set, add the include arm in src/lang/lang.h, then add two leaf envs
; here (one per board).
[env:wireless-paper-v1_2-en]
extends = env:wireless-paper-v1_2
build_flags = ${env:wireless-paper-v1_2.build_flags} -D LANG_EN

[env:wireless-paper-v1_2-es]
extends = env:wireless-paper-v1_2
build_flags = ${env:wireless-paper-v1_2.build_flags} -D LANG_ES_LA

[env:wireless-paper-v1_1-en]
extends = env:wireless-paper-v1_1
build_flags = ${env:wireless-paper-v1_1.build_flags} -D LANG_EN

[env:wireless-paper-v1_1-es]
extends = env:wireless-paper-v1_1
build_flags = ${env:wireless-paper-v1_1.build_flags} -D LANG_ES_LA
