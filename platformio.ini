; PlatformIO Project Configuration
;
; The repo is dual-build: the same sources compile under both Arduino IDE 2
; and PlatformIO. See README.md for the trade-off and per-build setup.
;
; Layout:
;   Pala_One_2_1/Pala_One_2_1.ino    — Arduino-IDE entry, also compiled by PIO
;   Pala_One_2_1/pala_api.h          — public app API headers (used by examples/)
;   Pala_One_2_1/pala_app.h
;   Pala_One_2_1/src/                — firmware modules (hal/, pure/, storage/, ui/, web/)
;   Pala_One_2_1/partitions.csv      — partition table
;
; src_dir is set to the sketch folder so PIO picks up both the .ino and
; everything under src/. Firmware sources use full-from-sketch-root includes
; like `#include "src/hal/display.h"` — same path resolves under Arduino IDE
; (sketch folder root is on its include path; `src/` is not, hence the prefix).
; See README.md "Include style" for the why.

[platformio]
src_dir = Pala_One_2_1

[env]
; Reserve headroom for SDK radio interrupt-allocation callbacks in IPC tasks.
custom_ipc_stack_bytes = 2048
; Ignore conflict copies of PlatformIO's temporary sketch conversion.
; Cloud-synced workspaces may restore these after a build deletes them.
build_src_filter = +<*> -<*.ino *.cpp>
; pioarduino fork — ships arduino-esp32 3.x (IDF 5.x), matching the Arduino IDE
; default. The classic `platformio/espressif32` registry build is still on
; 2.0.17 (IDF 4.4), which keeps Heltec's deep-sleep path on a code branch that
; powers off RTC_PERIPH and breaks ext0 wake. See src/ui/sleep.cpp for context.
; Pinned to release 55.03.38-1 (arduino-esp32 3.3.8 / IDF 5.5.4) so builds are
; reproducible; bump deliberately. The previous `stable` URL is a moving alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = Pala_One_2_1/partitions.csv
board_build.filesystem = littlefs
extra_scripts =
  pre:scripts/build_info.py
  post:scripts/link_optimization.py

; test/ holds host-side CMake unit tests, not PlatformIO on-device tests.
; Tell `pio test` to ignore everything in there so it doesn't try to compile
; laptop-only tests onto the ESP32.
test_ignore = *

; Static analysis — run with: pio check -e wireless-paper-v1_2-en
; check_skip_packages keeps cppcheck off the Arduino/library headers.
check_tool = cppcheck
check_severity = high, medium, low
check_flags =
  cppcheck: --enable=warning,style,performance,portability
            --suppress=missingIncludeSystem
            --suppress=*:*libdeps*
check_skip_packages = yes

lib_deps =
  ; heltec-eink-modules v4.6.0 is vendored in lib/ with a local SPI patch.
  adafruit/Adafruit GFX Library @ 1.12.6
  olikraus/U8g2_for_Adafruit_GFX @ 1.8.0
  ; Improv Serial protocol (improv-wifi.com) — browser-side Wi-Fi provisioning
  ; over USB-CDC, wrapped by src/hal/wifi_provisioning.cpp. Pinned to a commit
  ; (no tagged release) for reproducible builds.
  ; Improv WiFi is vendored in lib/ with a parser-state/bounds correction.
  ; JSON parser for OTA manifest fetch (src/hal/ota.cpp).
  bblanchon/ArduinoJson @ 7.2.1

; Base envs — set the board / display flags. They're not the recommended
; build targets directly; pick a language-qualified leaf env below instead.
; (Building one of these without a LANG_* falls back to LANG_EN with a
; #pragma message from src/config.h, so they still compile.)
[env:wireless-paper-v1_2]
build_flags =
  -D WIRELESS_PAPER
  -D PALA_IPC_STACK_BYTES=${env.custom_ipc_stack_bytes}
  -D DISPLAY_V1_2

[env:wireless-paper-v1_1]
build_flags =
  -D WIRELESS_PAPER
  -D PALA_IPC_STACK_BYTES=${env.custom_ipc_stack_bytes}
  -D DISPLAY_V1_1

; Board-specific flash defaults. Every image contains all eleven complete
; runtime catalogs; the app or browser can change the persisted reader language.
[env:wireless-paper-v1_2-en]
extends = env:wireless-paper-v1_2
build_flags = ${env:wireless-paper-v1_2.build_flags} -D LANG_EN

[env:wireless-paper-v1_2-es]
extends = env:wireless-paper-v1_2
build_flags = ${env:wireless-paper-v1_2.build_flags} -D LANG_ES_LA

[env:wireless-paper-v1_1-en]
extends = env:wireless-paper-v1_1
build_flags = ${env:wireless-paper-v1_1.build_flags} -D LANG_EN

[env:wireless-paper-v1_1-es]
extends = env:wireless-paper-v1_1
build_flags = ${env:wireless-paper-v1_1.build_flags} -D LANG_ES_LA

; Local instrumented build: USB diagnostics and framebuffer capture.
[env:wireless-paper-v1_2-local]
extends = env:wireless-paper-v1_2-en
build_flags = ${env:wireless-paper-v1_2-en.build_flags} -D PALA_DIAGNOSTICS=1 -D DEBUG_BUILD=0

[env:companion-v1_2-en]
extends = env:wireless-paper-v1_2-en
; Cross-translation-unit optimization retains all eleven locales in the existing OTA slot.
build_flags = ${env:wireless-paper-v1_2-en.build_flags} -D PALA_COMPANION_TEST -flto
lib_deps = ${env.lib_deps}
  h2zero/NimBLE-Arduino @ 2.5.2

[env:companion-v1_2-local]
extends = env:companion-v1_2-en
build_flags = ${env:companion-v1_2-en.build_flags} -D PALA_DIAGNOSTICS=1 -D DEBUG_BUILD=0

; Private release candidate: full Bluetooth/browser functionality, no USB diagnostics.
; All eleven languages remain available; English is only the initial default.
[env:companion-v1_2-release]
extends = env:companion-v1_2-en
custom_local_release = yes
build_flags = ${env:companion-v1_2-en.build_flags} -D PALA_DIAGNOSTICS=0 -D DEBUG_BUILD=0

; Companion release for the original V1.1 display; same BLE/features as V1.2.
[env:companion-v1_1-release]
extends = env:wireless-paper-v1_1-en
custom_local_release = yes
build_flags = ${env:wireless-paper-v1_1-en.build_flags} -D PALA_COMPANION_TEST -flto -D PALA_DIAGNOSTICS=0 -D DEBUG_BUILD=0
lib_deps = ${env.lib_deps}
  h2zero/NimBLE-Arduino @ 2.5.2

; Private wake/first-input timing probe. No capture commands or production deployment.
[env:companion-v1_2-wake-local]
extends = env:companion-v1_2-en
build_flags = ${env:companion-v1_2-en.build_flags} -D PALA_DIAGNOSTICS=0 -D PALA_WAKE_TRACE=1 -D DEBUG_BUILD=0
