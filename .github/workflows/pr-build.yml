name: PR Build

# Builds all four firmware variants in parallel, then fans-in to a single
# assemble job that packages the installer site. Triggered by the standard
# pull_request event so GITHUB_TOKEN is read-only — safe to run fork code.
#
# The privileged deploy step lives in pr-deploy.yml, triggered via
# workflow_run once this workflow completes. The PR number is smuggled
# through an artifact (pr-number) because workflow_run suppresses
# pull_requests[] for fork PRs as a security boundary.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        variant:
          - wireless-paper-v1_2-en
          - wireless-paper-v1_2-es
          - wireless-paper-v1_1-en
          - wireless-paper-v1_1-es
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e ${{ matrix.variant }}

      - name: Collect build outputs
        run: |
          mkdir -p artifacts
          cp .pio/build/${{ matrix.variant }}/firmware.bin   artifacts/
          cp .pio/build/${{ matrix.variant }}/bootloader.bin artifacts/
          cp .pio/build/${{ matrix.variant }}/partitions.bin artifacts/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
             artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: artifacts/
          retention-days: 1

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: downloads
          merge-multiple: false

      - name: Reconstruct PlatformIO build tree
        run: |
          for dir in downloads/firmware-*; do
            variant="${dir#downloads/firmware-}"
            mkdir -p ".pio/build/$variant"
            cp "$dir/firmware.bin"   ".pio/build/$variant/"
            cp "$dir/bootloader.bin" ".pio/build/$variant/"
            cp "$dir/partitions.bin" ".pio/build/$variant/"
          done
          mkdir -p ~/.platformio/packages/framework-arduinoespressif32/tools/partitions
          cp "$(find downloads -name boot_app0.bin | head -1)" \
             ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/

      - name: Assemble installer
        run: |
          python scripts/assemble_site.py \
            --channel pr \
            --version "pr-${{ github.event.number }}-${GITHUB_SHA::7}"

      # pr-number uploaded unconditionally so pr-deploy.yml can post a
      # failure comment even when a build step errors.
      - name: Save PR number
        run: echo "${{ github.event.number }}" > pr-number.txt

      - name: Upload PR number
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number.txt

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr-installer-bundle
          path: site/pr/
          retention-days: 30
