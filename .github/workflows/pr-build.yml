name: PR Build

# Builds all four firmware variants for a PR and uploads them as a workflow
# artifact. Triggered by the standard pull_request event so GITHUB_TOKEN is
# read-only — safe to run fork code here.
#
# The privileged deploy step lives in pr-deploy.yml, triggered via
# workflow_run once this job completes. The PR number is smuggled through
# the artifact (pr-number.txt) because workflow_run suppresses
# pull_requests[] for fork PRs as a security boundary.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Save PR number before any build step so pr-deploy.yml can post a
      # failure comment even when a later step errors.
      - name: Save PR number
        run: echo "${{ github.event.number }}" > pr-number.txt

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (V1.2 EN)
        run: pio run -e wireless-paper-v1_2-en

      - name: Build firmware (V1.2 ES)
        run: pio run -e wireless-paper-v1_2-es

      - name: Build firmware (V1.1 EN)
        run: pio run -e wireless-paper-v1_1-en

      - name: Build firmware (V1.1 ES)
        run: pio run -e wireless-paper-v1_1-es

      - name: Assemble installer
        run: |
          python scripts/assemble_site.py \
            --channel pr \
            --version "pr-${{ github.event.number }}-${GITHUB_SHA::7}"

      # pr-number is uploaded unconditionally so pr-deploy.yml can post a
      # failure comment even when the build itself errors.
      - name: Upload PR number
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number.txt

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr-installer-bundle
          path: site/pr/
          retention-days: 30
