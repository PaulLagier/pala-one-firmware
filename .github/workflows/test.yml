name: Host tests

# Runs CMake/CTest on every push and pull request: pure logic, production
# modules with host adapters, browser scripts, generated assets and packaging.
# See test/README.md for the validation layers and their limits.

on:
  push:
  pull_request:

# Cancel superseded runs — including the redundant push-triggered run that
# fires alongside pull_request for commits on a branch with an open PR
# (same commit, same key, so whichever run starts second cancels the other).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev python3 libssl-dev clang

      - name: Configure
        run: cmake -S test -B test/build

      - name: Build
        run: cmake --build test/build --config Release

      # Show individual regression cases as well as CTest target results.
      - name: Run tests
        run: ctest --test-dir test/build -C Release -V
