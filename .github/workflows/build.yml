name: Build firmware

# Compile-only smoke test on every push and pull request. Builds both
# board revisions (V1.1, V1.2) using the English language variant only —
# the two languages share the same source tree and only differ in string
# tables, so a single language is enough to catch build breakage on both
# boards. This is a build check, not a release: no artifacts are saved.

on:
  push:
  pull_request:

# Cancel superseded runs — including the redundant push-triggered run that
# fires alongside pull_request for commits on a branch with an open PR
# (same commit, same key, so whichever run starts second cancels the other).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [wireless-paper-v1_1-en, wireless-paper-v1_2-en]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}
