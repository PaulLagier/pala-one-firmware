name: Build firmware

# Check all six board/default-language images before merging. Every image
# contains all runtime catalogs, but linker layout varies by initial default.
# Check the final padded binary as well as PlatformIO's ELF size estimate.

on:
  push:
  pull_request:

# Cancel superseded runs — including the redundant push-triggered run that
# fires alongside pull_request for commits on a branch with an open PR
# (same commit, same key, so whichever run starts second cancels the other).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [wireless-paper-v1_1-en, wireless-paper-v1_1-es, wireless-paper-v1_1-fr, wireless-paper-v1_2-en, wireless-paper-v1_2-es, wireless-paper-v1_2-fr]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Check final OTA image size
        run: test "$(wc -c < .pio/build/${{ matrix.env }}/firmware.bin)" -le 1900544
