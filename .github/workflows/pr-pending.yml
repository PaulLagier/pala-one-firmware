name: PR Pending Comment

# Posts (or updates) a "building..." bot comment immediately when a PR is
# opened or pushed to. The pr-deploy.yml workflow later updates the same
# comment with the actual flasher URL once the build finishes.
#
# Uses pull_request_target so GITHUB_TOKEN has write access even for fork
# PRs. Safe because this job performs NO checkout of fork code — it only
# calls the GitHub API.

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post or update "building" comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const actionsUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`;
            const marker = '<!-- pr-web-flasher -->';
            const body = [
              marker,
              `## Web Flasher — PR #${prNumber}`,
              `🔨 **Building firmware from \`${sha}\`...** The flash link will appear here when the build completes (~10–15 min).`,
              `[View build progress](${actionsUrl})`,
            ].join('\n\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
